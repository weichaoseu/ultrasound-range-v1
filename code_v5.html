<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声学差分测距仪 (高精度滑动窗口版)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; font-size: 1.2rem; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 1.05rem; cursor: pointer; margin-top: 10px; transition: opacity 0.2s; }
        .btn-primary { background: #0284c7; color: white; }
        .btn-success { background: #16a34a; color: white; }
        .btn-danger { background: #dc2626; color: white; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box; font-size: 1rem; margin-top: 5px; }
        label { display: block; font-size: 0.9rem; color: #94a3b8; margin-bottom: 2px; }
        .metric-title { font-size: 0.9rem; color: #94a3b8; }
        .metric-value { font-size: 2.5rem; font-weight: bold; color: #38bdf8; margin: 10px 0; text-align: center; }
        canvas { width: 100%; height: 140px; background: #090d16; border-radius: 6px; margin-top: 10px; }
        .status { padding: 4px 10px; border-radius: 4px; font-size: 0.85rem; display: inline-block; font-weight: bold; }
        .status-off { background: #475569; color: #cbd5e1; }
        .status-on { background: #16a34a; color: white; }
        .step-box { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; margin-top: 15px; }
    </style>
</head>
<body>

    <!-- 1. 发射端模块 -->
    <div class="card">
        <h2>步骤一：发射端控制 (手机A)</h2>
        <button class="btn btn-primary" id="txToggleBtn">▶ 开启发射端 (循环播放18kHz声波)</button>
        <div style="margin-top: 12px;">
            发射状态: <span id="txStatus" class="status status-off">未开启</span>
        </div>
    </div>

    <!-- 2. 接收端测距与校准模块 -->
    <div class="card">
        <h2>步骤二：接收端测量与校准 (手机B)</h2>
        
        <div class="grid" style="margin-bottom: 15px;">
            <button class="btn btn-success" id="startRxBtn">▶ 开始测量 (启动麦克风)</button>
            <button class="btn btn-danger" id="stopRxBtn" disabled>⏹ 结束测量 (停止录音)</button>
        </div>
        <div style="margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between;">
            <div>录音状态: <span id="rxStatus" class="status status-off">未启动</span></div>
            <div id="signalQuality" style="font-size: 0.9rem; color: #94a3b8;">信号强度: --</div>
        </div>

        <!-- 环境参数设置 -->
        <div class="grid">
            <div>
                <label>环境温度 (°C)</label>
                <input type="number" id="tempInput" value="25" step="1">
            </div>
            <div>
                <label>计算声速 (m/s)</label>
                <input type="text" id="soundSpeedDisplay" value="346.3" readonly style="color: #38bdf8; background: #1e293b;">
            </div>
        </div>

        <!-- 校准基准距离设置 -->
        <div class="step-box">
            <label style="color: #38bdf8; font-weight: bold; font-size: 1rem;">1. 校准基准设定 ($d_0$)</label>
            <div class="metric-title" style="margin-top: 4px;">量好两台手机之间的初始距离并填入：</div>
            <div style="display: flex; gap: 10px; align-items: center; margin-top: 8px;">
                <input type="number" id="d0Input" value="1.000" step="0.001" style="flex: 2; margin-top: 0;">
                <span style="flex: 1; font-weight: bold; font-size: 1.1rem;">米 (m)</span>
            </div>
            <button class="btn btn-primary" id="calibrateBtn" style="margin-top: 12px;" disabled>🔒 锁定当前位置为基准 ($t_0$)</button>
            <div id="calibStatus" style="font-size: 0.9rem; color: #f59e0b; margin-top: 8px;">状态：尚未标定 (请先点击“开始测量”并对准后点击锁定)</div>
        </div>

        <!-- 实时解算显示 -->
        <div class="step-box" style="text-align: center;">
            <div class="metric-title">2. 待测距离实时解算 ($d$)</div>
            <div class="metric-value" id="distDisplay">--.--- m</div>
            <div id="deltaDisplay" style="font-size: 1rem; color: #10b981; font-weight: bold;">相对位移 Δd: -- mm</div>
        </div>

        <!-- 信号波形监测 -->
        <div style="margin-top: 15px;">
            <span class="metric-title">连续滑动窗口互相关峰值波形:</span>
            <canvas id="corrCanvas"></canvas>
        </div>
    </div>

<script>
const FS = 48000;          // 采样率
const CARRIER_FREQ = 18000;// 载波频率 18kHz
const CHIP_RATE = 2000;    // 码率
const PRN_LEN = 63;        // 序列长度

let txAudioCtx = null, rxAudioCtx = null;
let txSourceNode = null;
let rxMediaStream = null, rxProcessorNode = null;

let t0_samples = null;
let soundSpeed = 346.3;

// --- 连续滑动历史缓冲区 (Rolling Buffer) ---
const HISTORY_SIZE = 24000; // 0.5秒的历史连续音频窗口
let rollingBuffer = new Float32Array(HISTORY_SIZE);
let bufferWriteHead = 0;

// 平滑滤波器状态
let smoothPeak = null;

// 生成 m 序列
function generateMSequence() {
    let reg = 0x3F;
    let seq = [];
    for (let i = 0; i < PRN_LEN; i++) {
        let feedback = ((reg >> 5) ^ (reg >> 4)) & 1;
        seq.push((reg & 1) ? 1 : -1);
        reg = ((reg << 1) | feedback) & 0x3F;
    }
    return seq;
}

// 构造 PRN 信号模板
function createPRNAudioBuffer(ctx) {
    const mSeq = generateMSequence();
    const samplesPerChip = Math.floor(FS / CHIP_RATE);
    const totalSamples = mSeq.length * samplesPerChip;
    const buffer = ctx.createBuffer(1, totalSamples, FS);
    const data = buffer.getChannelData(0);

    for (let i = 0; i < totalSamples; i++) {
        const chipIdx = Math.floor(i / samplesPerChip);
        const t = i / FS;
        data[i] = mSeq[chipIdx] * Math.sin(2 * Math.PI * CARRIER_FREQ * t);
    }
    return buffer;
}

// 温度联动
document.getElementById('tempInput').oninput = () => {
    const temp = parseFloat(document.getElementById('tempInput').value) || 25;
    soundSpeed = 331.3 + 0.6 * temp;
    document.getElementById('soundSpeedDisplay').value = soundSpeed.toFixed(1) + ' m/s';
};

// ---------------- 发射端逻辑控制 ----------------
let isTxRunning = false;
document.getElementById('txToggleBtn').onclick = async () => {
    if (!isTxRunning) {
        txAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: FS });
        await txAudioCtx.resume();
        const buffer = createPRNAudioBuffer(txAudioCtx);
        txSourceNode = txAudioCtx.createBufferSource();
        txSourceNode.buffer = buffer;
        txSourceNode.loop = true;
        txSourceNode.connect(txAudioCtx.destination);
        txSourceNode.start();
        
        isTxRunning = true;
        document.getElementById('txToggleBtn').innerText = '⏹ 关闭发射端';
        document.getElementById('txStatus').className = 'status status-on';
        document.getElementById('txStatus').innerText = '发射中 (18kHz)';
    } else {
        if (txSourceNode) txSourceNode.stop();
        if (txAudioCtx) txAudioCtx.close();
        isTxRunning = false;
        document.getElementById('txToggleBtn').innerText = '▶ 开启发射端 (循环播放18kHz声波)';
        document.getElementById('txStatus').className = 'status status-off';
        document.getElementById('txStatus').innerText = '未开启';
    }
};

// ---------------- 接收端：开始测量 ----------------
const startRxBtn = document.getElementById('startRxBtn');
const stopRxBtn = document.getElementById('stopRxBtn');
const calibrateBtn = document.getElementById('calibrateBtn');

startRxBtn.onclick = async () => {
    rxAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: FS });
    await rxAudioCtx.resume();
    
    try {
        rxMediaStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
        const mic = rxAudioCtx.createMediaStreamSource(rxMediaStream);
        
        rxProcessorNode = rxAudioCtx.createScriptProcessor(4096, 1, 1);
        const template = createPRNAudioBuffer(rxAudioCtx).getChannelData(0);
        
        mic.connect(rxProcessorNode);
        rxProcessorNode.connect(rxAudioCtx.destination);
        
        startRxBtn.disabled = true;
        stopRxBtn.disabled = false;
        calibrateBtn.disabled = false;
        document.getElementById('rxStatus').className = 'status status-on';
        document.getElementById('rxStatus').innerText = '录音测量中';

        const canvas = document.getElementById('corrCanvas');
        const ctx2d = canvas.getContext('2d');
        const M = template.length;

        rxProcessorNode.onaudioprocess = (e) => {
            const input = e.inputBuffer.getChannelData(0);
            
            // 将新音频块追加到连续的滑动历史缓冲区中
            for (let i = 0; i < input.length; i++) {
                rollingBuffer[bufferWriteHead] = input[i];
                bufferWriteHead = (bufferWriteHead + 1) % HISTORY_SIZE;
            }

            // 对整个 HISTORY_SIZE 连续缓冲区进行互相关计算
            const searchLen = HISTORY_SIZE - M;
            let maxCorr = 0;
            let peakOffset = 0;
            let corrMap = new Float32Array(searchLen);

            for (let i = 0; i < searchLen; i += 4) { // 步进4加速
                let sum = 0;
                for (let j = 0; j < M; j += 4) {
                    let bufIdx = (bufferWriteHead + i + j) % HISTORY_SIZE;
                    sum += rollingBuffer[bufIdx] * template[j];
                }
                corrMap[i] = sum;
                if (sum > maxCorr) {
                    maxCorr = sum;
                    peakOffset = i;
                }
            }

            // 门限判断
            if (maxCorr < 0.2) {
                document.getElementById('signalQuality').innerText = "信号强度: 弱 (请靠近发射源)";
                document.getElementById('signalQuality').style.color = "#ef4444";
                return;
            } else {
                document.getElementById('signalQuality').innerText = "信号强度: 良好";
                document.getElementById('signalQuality').style.color = "#10b981";
            }

            // 抛物线亚采样平滑
            let finePeak = peakOffset;
            if (peakOffset > 0 && peakOffset < searchLen - 4) {
                let y1 = corrMap[peakOffset - 4], y2 = corrMap[peakOffset], y3 = corrMap[peakOffset + 4];
                let delta = (y1 - y3) / (2 * (y1 - 2 * y2 + y3));
                if (!isNaN(delta)) finePeak += delta * 4;
            }

            // 强力平滑滤波器 (EMA 权重 0.95，极大地消除随机抖动)
            if (smoothPeak === null) {
                smoothPeak = finePeak;
            } else {
                smoothPeak = 0.05 * finePeak + 0.95 * smoothPeak;
            }

            // 实时距离解算
            const d0 = parseFloat(document.getElementById('d0Input').value) || 1.0;
            if (t0_samples !== null) {
                const dt = (smoothPeak - t0_samples) / FS;
                const d = d0 + soundSpeed * dt;
                const deltaM = d - d0;
                
                document.getElementById('distDisplay').innerText = d.toFixed(3) + ' m';
                document.getElementById('deltaDisplay').innerText = `相对位移 Δd: ${(deltaM >= 0 ? '+' : '') + (deltaM * 1000).toFixed(1)} mm`;
            }

            // 绘制波形
            ctx2d.clearRect(0, 0, canvas.width, canvas.height);
            ctx2d.strokeStyle = '#38bdf8';
            ctx2d.lineWidth = 2;
            ctx2d.beginPath();
            for (let i = 0; i < searchLen; i += 16) {
                let x = (i / searchLen) * canvas.width;
                let y = canvas.height - (maxCorr > 0 ? (corrMap[i] / maxCorr) * (canvas.height - 10) : 0);
                if (i === 0) ctx2d.moveTo(x, y); else ctx2d.lineTo(x, y);
            }
            ctx2d.stroke();
        };

        // 校准按钮绑定
        calibrateBtn.onclick = () => {
            if (smoothPeak === null) return;
            t0_samples = smoothPeak;
            const currentd0 = document.getElementById('d0Input').value;
            document.getElementById('calibStatus').innerHTML = `✅ <b style="color: #10b981;">基准标定成功！</b> d0=${currentd0}m, 锁定 t0=${t0_samples.toFixed(1)}`;
        };

    } catch (err) {
        alert("无法开启麦克风，请检查是否在 HTTPS 或本地服务器环境下访问！");
        console.error(err);
    }
};

// ---------------- 接收端：结束测量 ----------------
stopRxBtn.onclick = () => {
    if (rxMediaStream) {
        rxMediaStream.getTracks().forEach(track => track.stop());
    }
    if (rxAudioCtx) {
        rxAudioCtx.close();
    }
    
    startRxBtn.disabled = false;
    stopRxBtn.disabled = true;
    calibrateBtn.disabled = true;
    smoothPeak = null;
    rollingBuffer.fill(0);
    
    document.getElementById('rxStatus').className = 'status status-off';
    document.getElementById('rxStatus').innerText = '已停止';
    document.getElementById('signalQuality').innerText = "信号强度: --";
    document.getElementById('signalQuality').style.color = "#94a3b8";
};
</script>
</body>
</html>
