<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声学差分测距仪 (12kHz高稳定版)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
        h2 { margin-top: 0; font-size: 1.1rem; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        .btn-primary { background: #0284c7; color: white; }
        .btn-success { background: #16a34a; color: white; }
        .btn-danger { background: #dc2626; color: white; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box; font-size: 1rem; margin-top: 5px; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; }
        .metric-value { font-size: 2.5rem; font-weight: bold; color: #38bdf8; margin: 10px 0; text-align: center; }
        canvas { width: 100%; height: 130px; background: #090d16; border-radius: 6px; margin-top: 10px; }
        .status { padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; display: inline-block; font-weight: bold; }
        .status-off { background: #475569; color: #cbd5e1; }
        .status-on { background: #16a34a; color: white; }
        .step-box { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; margin-top: 15px; }
        .meter-bar { height: 10px; background: #334155; border-radius: 5px; overflow: hidden; margin-top: 6px; }
        .meter-fill { height: 100%; width: 0%; background: #10b981; transition: width 0.1s; }
    </style>
</head>
<body>

    <!-- 发射控制 -->
    <div class="card">
        <h2>1. 发射端控制 (手机A)</h2>
        <button class="btn btn-primary" id="txBtn">▶ 开启声波发射 (12kHz PRN)</button>
        <div style="margin-top: 10px;">状态: <span id="txStatus" class="status status-off">未开启</span></div>
        <div style="font-size: 0.85rem; color: #94a3b8; margin-top: 6px;">提示：手机A音量请调至 70% 以上。</div>
    </div>

    <!-- 接收与测距控制 -->
    <div class="card">
        <h2>2. 接收端测量与校准 (手机B)</h2>
        <div class="grid" style="margin-bottom: 12px;">
            <button class="btn btn-success" id="startRxBtn">▶ 开始测量</button>
            <button class="btn btn-danger" id="stopRxBtn" disabled>⏹ 停止测量</button>
        </div>
        <div style="margin-bottom: 12px;">
            状态: <span id="rxStatus" class="status status-off">未启动</span> | 
            <span id="signalInfo" style="color: #94a3b8;">等待接收...</span>
        </div>
        
        <div>
            <label>麦克风实时音量强度:</label>
            <div class="meter-bar"><div class="meter-fill" id="volFill"></div></div>
        </div>

        <div class="grid" style="margin-top: 12px;">
            <div>
                <label>环境温度 (°C)</label>
                <input type="number" id="tempInput" value="25" step="1">
            </div>
            <div>
                <label>计算声速 (m/s)</label>
                <input type="text" id="soundSpeedDisplay" value="346.3" readonly style="background: #1e293b; color: #38bdf8;">
            </div>
        </div>

        <!-- 标定步骤 -->
        <div class="step-box">
            <label style="color: #38bdf8; font-weight: bold;">步骤一：输入已知初始距离 d0 并标定</label>
            <div style="display: flex; gap: 10px; align-items: center; margin-top: 8px;">
                <input type="number" id="d0Input" value="1.000" step="0.001" style="flex: 2; margin-top: 0;">
                <span style="flex: 1; font-weight: bold;">米 (m)</span>
            </div>
            <button class="btn btn-primary" id="calibrateBtn" style="margin-top: 10px;" disabled>🔒 锁定当前基准 (t0)</button>
            <div id="calibStatus" style="font-size: 0.85rem; color: #f59e0b; margin-top: 6px;">状态：未标定</div>
        </div>

        <!-- 测量结果 -->
        <div class="step-box" style="text-align: center;">
            <label>步骤二：待测距离实时解算 (d)</label>
            <div class="metric-value" id="distDisplay">--.--- m</div>
            <div id="deltaDisplay" style="font-size: 0.95rem; color: #10b981; font-weight: bold;">相对位移 Δd: -- mm</div>
        </div>

        <canvas id="corrCanvas"></canvas>
    </div>

<script>
const FS = 48000;
const CARRIER = 12000;     // 改为 12kHz，避开手机麦克风的高通硬件过滤
const CHIP_RATE = 2000;
const PRN_LEN = 63;

let audioCtx = null;
let txSource = null;
let micStream = null;
let processor = null;

let t0_samples = null;
let soundSpeed = 346.3;

// 生成 m 序列
function getMSeq() {
    let reg = 0x3F;
    let seq = [];
    for (let i = 0; i < PRN_LEN; i++) {
        let fb = ((reg >> 5) ^ (reg >> 4)) & 1;
        seq.push((reg & 1) ? 1 : -1);
        reg = ((reg << 1) | fb) & 0x3F;
    }
    return seq;
}

// 创建一周期 PRN 模板
const mSeq = getMSeq();
const samplesPerChip = Math.floor(FS / CHIP_RATE);
const templateLen = mSeq.length * samplesPerChip;
let template = new Float32Array(templateLen);
for (let i = 0; i < templateLen; i++) {
    let chip = mSeq[Math.floor(i / samplesPerChip)];
    template[i] = chip * Math.sin(2 * Math.PI * CARRIER * (i / FS));
}

// 温度联动
document.getElementById('tempInput').oninput = (e) => {
    let t = parseFloat(e.target.value) || 25;
    soundSpeed = 331.3 + 0.6 * t;
    document.getElementById('soundSpeedDisplay').value = soundSpeed.toFixed(1) + ' m/s';
};

// 1. 发射端控制
let txRunning = false;
document.getElementById('txBtn').onclick = async () => {
    if (!txRunning) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: FS });
        await audioCtx.resume();
        let buf = audioCtx.createBuffer(1, templateLen, FS);
        buf.getChannelData(0).set(template);
        txSource = audioCtx.createBufferSource();
        txSource.buffer = buf;
        txSource.loop = true;
        txSource.connect(audioCtx.destination);
        txSource.start();

        txRunning = true;
        document.getElementById('txBtn').innerText = '⏹ 关闭声波发射';
        document.getElementById('txStatus').className = 'status status-on';
        document.getElementById('txStatus').innerText = '发射中';
    } else {
        if (txSource) txSource.stop();
        txRunning = false;
        document.getElementById('txBtn').innerText = '▶ 开启声波发射 (12kHz PRN)';
        document.getElementById('txStatus').className = 'status status-off';
        document.getElementById('txStatus').innerText = '未开启';
    }
};

// 2. 接收端控制
const startRxBtn = document.getElementById('startRxBtn');
const stopRxBtn = document.getElementById('stopRxBtn');
const calibrateBtn = document.getElementById('calibrateBtn');

startRxBtn.onclick = async () => {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: FS });
    await audioCtx.resume();

    try {
        micStream = await navigator.mediaDevices.getUserMedia({ 
            audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
        });
        let micSource = audioCtx.createMediaStreamSource(micStream);
        
        processor = audioCtx.createScriptProcessor(2048, 1, 1);
        micSource.connect(processor);
        processor.connect(audioCtx.destination);

        startRxBtn.disabled = true;
        stopRxBtn.disabled = false;
        calibrateBtn.disabled = false;
        document.getElementById('rxStatus').className = 'status status-on';
        document.getElementById('rxStatus').innerText = '运行中';

        let canvas = document.getElementById('corrCanvas');
        let ctx2d = canvas.getContext('2d');

        const histSize = 24000;
        let histBuffer = new Float32Array(histSize);
        let writeHead = 0;
        let smoothPeak = null;

        processor.onaudioprocess = (e) => {
            let input = e.inputBuffer.getChannelData(0);
            
            // 计算音量能量条
            let rms = 0;
            for (let i = 0; i < input.length; i++) {
                histBuffer[writeHead] = input[i];
                writeHead = (writeHead + 1) % histSize;
                rms += input[i] * input[i];
            }
            rms = Math.sqrt(rms / input.length);
            let pct = Math.min(100, Math.round(rms * 300));
            document.getElementById('volFill').style.width = pct + '%';

            // 互相关匹配
            let searchLen = histSize - templateLen;
            let maxCorr = -1e9;
            let bestOffset = 0;
            let corrResult = new Float32Array(Math.floor(searchLen / 4));

            for (let i = 0; i < searchLen; i += 4) {
                let sum = 0;
                for (let j = 0; j < templateLen; j += 8) {
                    let bufIdx = (writeHead + i + j) % histSize;
                    sum += histBuffer[bufIdx] * template[j];
                }
                let idx = Math.floor(i / 4);
                corrResult[idx] = sum;
                if (sum > maxCorr) {
                    maxCorr = sum;
                    bestOffset = i;
                }
            }

            // 更宽容的信号门限
            if (maxCorr < 0.3) {
                document.getElementById('signalInfo').innerText = "未检测到PRN信号 (请调大手机A音量或靠近)";
                document.getElementById('signalInfo').style.color = "#ef4444";
                return;
            } else {
                document.getElementById('signalInfo').innerText = "已捕获信号 (锁定中)";
                document.getElementById('signalInfo').style.color = "#10b981";
            }

            if (smoothPeak === null) {
                smoothPeak = bestOffset;
            } else {
                let diff = bestOffset - smoothPeak;
                if (diff > 3) diff = 3;
                if (diff < -3) diff = -3;
                smoothPeak += diff * 0.3;
            }

            let d0 = parseFloat(document.getElementById('d0Input').value) || 1.0;
            if (t0_samples !== null) {
                let dt = (smoothPeak - t0_samples) / FS;
                let d = d0 + soundSpeed * dt;
                let deltaMm = (d - d0) * 1000;
                document.getElementById('distDisplay').innerText = d.toFixed(3) + ' m';
                document.getElementById('deltaDisplay').innerText = `相对位移 Δd: ${(deltaMm >= 0 ? '+' : '') + deltaMm.toFixed(1)} mm`;
            }

            // 绘制波形
            ctx2d.clearRect(0, 0, canvas.width, canvas.height);
            ctx2d.strokeStyle = '#38bdf8';
            ctx2d.lineWidth = 2;
            ctx2d.beginPath();
            for (let i = 0; i < corrResult.length; i++) {
                let x = (i / corrResult.length) * canvas.width;
                let y = canvas.height - (corrResult[i] / (maxCorr || 1)) * (canvas.height - 10);
                if (i === 0) ctx2d.moveTo(x, y); else ctx2d.lineTo(x, y);
            }
            ctx2d.stroke();
        };

        calibrateBtn.onclick = () => {
            if (smoothPeak === null) return;
            t0_samples = smoothPeak;
            document.getElementById('calibStatus').innerHTML = `✅ <b style="color: #10b981;">已成功标定！</b> t0 = ${t0_samples.toFixed(1)}`;
        };

    } catch (err) {
        alert("无法打开麦克风，请检查浏览器权限！");
        console.error(err);
    }
};

stopRxBtn.onclick = () => {
    if (processor) processor.disconnect();
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    startRxBtn.disabled = false;
    stopRxBtn.disabled = true;
    calibrateBtn.disabled = true;
    document.getElementById('rxStatus').className = 'status status-off';
    document.getElementById('rxStatus').innerText = '已停止';
    document.getElementById('signalInfo').innerText = "等待接收...";
};
</script>
</body>
</html>
