<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>声学测距系统 (同步分块锁定版)</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --primary: #38bdf8;
    --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
    --text: #f8fafc; --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); padding: 16px; max-width: 600px; margin: 0 auto; }
  h1 { font-size: 1.2rem; text-align: center; margin-bottom: 14px; color: var(--primary); }
  .tabs { display: flex; gap: 10px; margin-bottom: 14px; }
  .tab-btn {
    flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600;
    background: var(--card); color: var(--muted); cursor: pointer;
  }
  .tab-btn.active { background: var(--primary); color: #0f172a; }
  .panel { display: none; background: var(--card); padding: 18px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
  .panel.active { display: block; }
  .btn {
    width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 1.05rem; font-weight: bold;
    cursor: pointer; margin-top: 10px;
  }
  .btn-start { background: var(--success); color: #fff; }
  .btn-stop { background: var(--danger); color: #fff; }
  .btn-cal { background: var(--warning); color: #0f172a; }
  .metric-box {
    background: #0f172a; border-radius: 12px; padding: 16px; text-align: center; margin: 12px 0;
    border: 1px solid #334155;
  }
  .distance-val { font-size: 3rem; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }
  .unit { font-size: 1.1rem; color: var(--muted); }
  .status-badge {
    display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; margin-top: 8px;
  }
  .status-valid { background: rgba(16, 185, 129, 0.2); color: var(--success); }
  .status-reject { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
  .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .stat-item { background: #0f172a; padding: 10px; border-radius: 8px; font-size: 0.85rem; color: var(--muted); }
  .stat-item span { display: block; font-size: 1.1rem; font-weight: bold; color: #fff; margin-top: 4px; }
  .control-row { margin: 12px 0; font-size: 0.9rem; }
  .control-row label { display: flex; justify-content: space-between; margin-bottom: 6px; color: var(--muted); }
  input[type="number"] {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155;
    background: #0f172a; color: #fff; font-size: 1rem; margin-top: 4px;
  }
  canvas { width: 100%; height: 110px; background: #0f172a; border-radius: 8px; margin-top: 10px; border: 1px solid #334155; }
  .info-text { font-size: 0.8rem; color: var(--muted); line-height: 1.5; margin-top: 10px; }
</style>
</head>
<body>

<h1>📡 声学测距系统 (同步分块锁定版)</h1>

<div class="tabs">
  <button class="tab-btn active" onclick="switchMode('tx')">📱 发射端 (TX)</button>
  <button class="tab-btn" onclick="switchMode('rx')">🎙️ 接收端 (RX)</button>
</div>

<!-- 发射端 -->
<div id="panel-tx" class="panel active">
  <p class="info-text">发射端首尾相接、连续循环发送 Gold 序列编码的 4-FSK 声波。</p>
  <div class="metric-box">
    <div style="font-size:0.9rem; color:var(--muted);">序列周期状态</div>
    <div class="distance-val" style="font-size:1.8rem;" id="tx-period-txt">-- <span class="unit">ms</span></div>
    <div id="tx-status" class="status-badge status-reject">未发射</div>
  </div>
  <button id="btn-tx-toggle" class="btn btn-start" onclick="toggleTX()">开始连续发射</button>
</div>

<!-- 接收端 -->
<div id="panel-rx" class="panel">
  <div class="metric-box">
    <div style="font-size:0.85rem; color:var(--muted);">分块锁定测距结果</div>
    <div class="distance-val"><span id="ui-dist">--.--</span> <span class="unit">cm</span></div>
    <div id="ui-badge" class="status-badge status-reject">等待校准锁定...</div>
  </div>

  <div class="grid-stats">
    <div class="stat-item">当前块匹配峰值<span id="ui-peak">0 / 63</span></div>
    <div class="stat-item">内部微小移位 (Lag)<span id="ui-lag">0.00</span></div>
    <div class="stat-item">锁定状态<span id="ui-lock">未锁定</span></div>
    <div class="stat-item">帧处理计数<span id="ui-frames">0</span></div>
  </div>

  <div class="control-row">
    <label><span>基准校准：两机对齐后点击，锁定当前帧边界与距离</span></label>
    <div style="display:flex; gap:8px;">
      <input type="number" id="input-d0" value="30.0" step="1" style="flex:1;">
      <button class="btn btn-cal" style="flex:1.2; margin-top:4px; padding:10px;" onclick="triggerCalibration()">一键锁定校准</button>
    </div>
  </div>

  <canvas id="corr-canvas"></canvas>

  <button id="btn-rx-toggle" class="btn btn-start" onclick="toggleRX()">启动接收监听</button>
</div>

<script>
const SAMPLE_RATE = 48000;
const SOUND_SPEED = 34300; // cm/s
const CHIP_RATE = 400;     // 400 symbols/sec
const SAMPLES_PER_SYM = Math.floor(SAMPLE_RATE / CHIP_RATE); // 120 采样点/符号
const GOLD_LEN = 63;
const NUM_SYMS = Math.ceil(GOLD_LEN / 2); // 32 个符号
const FREQS = [12000, 13500, 15000, 16500];

// 一个完整的 Gold 序列在空气中占用的精确采样点数
const SEQ_SAMPLES = NUM_SYMS * SAMPLES_PER_SYM; // 32 * 120 = 3840 点 (即 80ms)
document.getElementById('tx-period-txt.innerHTML') // 动态显示周期

// 生成 63 位 Gold 序列
function generateGoldSequence() {
  let reg1 = 0x3F, reg2 = 0x3F;
  const gold = new Int8Array(GOLD_LEN);
  for (let i = 0; i < GOLD_LEN; i++) {
    const bit1 = reg1 & 1;
    const bit2 = reg2 & 1;
    gold[i] = (bit1 ^ bit2) === 1 ? 1 : -1;
    reg1 = ((reg1 << 1) | (((reg1 >> 5) ^ (reg1 >> 0)) & 1)) & 0x3F;
    reg2 = ((reg2 << 1) | (((reg2 >> 5) ^ (reg2 >> 4) ^ (reg2 >> 1) ^ (reg2 >> 0)) & 1)) & 0x3F;
  }
  return gold;
}
const GOLD_TEMPLATE = generateGoldSequence();

function encodeGoldToSymbols(goldSeq) {
  const syms = new Uint8Array(NUM_SYMS);
  for (let i = 0; i < NUM_SYMS; i++) {
    const b1 = goldSeq[i * 2] === 1 ? 1 : 0;
    const b2 = (i * 2 + 1 < goldSeq.length) ? (goldSeq[i * 2 + 1] === 1 ? 1 : 0) : 0;
    syms[i] = (b1 << 1) | b2;
  }
  return syms;
}
const TX_SYMBOLS = encodeGoldToSymbols(GOLD_TEMPLATE);

function switchMode(mode) {
  document.querySelectorAll('.tab-btn').forEach((b, idx) => {
    b.classList.toggle('active', (mode === 'tx' && idx === 0) || (mode === 'rx' && idx === 1));
  });
  document.getElementById('panel-tx').classList.toggle('active', mode === 'tx');
  document.getElementById('panel-rx').classList.toggle('active', mode === 'rx');
}

// 发射端：首尾相接连续循环发送
let txCtx = null, txSource = null, isTxRunning = false;

function toggleTX() {
  const btn = document.getElementById('btn-tx-toggle');
  const status = document.getElementById('tx-status');
  if (!isTxRunning) {
    txCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
    
    // 构造单周期 Buffer，设置 loop = true 实现完美首尾相接
    const buffer = txCtx.createBuffer(1, SEQ_SAMPLES, txCtx.sampleRate);
    const data = buffer.getChannelData(0);
    let offset = 0;
    for (let s = 0; s < TX_SYMBOLS.length; s++) {
      const freq = FREQS[TX_SYMBOLS[s]];
      for (let n = 0; n < SAMPLES_PER_SYM; n++) {
        if (offset + n < SEQ_SAMPLES) {
          const env = 0.5 * (1 - Math.cos((2 * Math.PI * n) / (SAMPLES_PER_SYM - 1)));
          data[offset + n] = 0.85 * env * Math.sin(2 * Math.PI * freq * (n / txCtx.sampleRate));
        }
      }
      offset += SAMPLES_PER_SYM;
    }

    txSource = txCtx.createBufferSource();
    txSource.buffer = buffer;
    txSource.loop = true; // 循环首尾相接
    txSource.connect(txCtx.destination);
    txSource.start();

    isTxRunning = true;
    btn.innerText = "停止连续发射";
    btn.className = "btn btn-stop";
    status.innerText = "正在首尾相接连续发射...";
    status.className = "status-badge status-valid";
  } else {
    isTxRunning = false;
    if (txSource) txSource.stop();
    if (txCtx) txCtx.close();
    btn.innerText = "开始连续发射";
    btn.className = "btn btn-start";
    status.innerText = "未发射";
    status.className = "status-badge status-reject";
  }
}

// 接收端：同步分块与锁定校准
let rxCtx = null, rxStream = null, rxProcessor = null, isRxRunning = false;
const RING_SIZE = SEQ_SAMPLES * 4; // 4 个周期大小的环形缓冲区
let ringBuffer = new Float32Array(RING_SIZE);
let ringWritePtr = 0;

let isLocked = false;          // 是否已校准锁定
let lockedSampleOffset = 0;    // 校准锁定的起始采样点偏移
let calibratedD0 = 30.0;
let frameCount = 0;

function triggerCalibration() {
  // 执行一次快速全局扫描，找到当前最佳峰值位置作为锁定边界
  lockedSampleOffset = findBestAlignment(ringBuffer, ringWritePtr);
  calibratedD0 = parseFloat(document.getElementById('input-d0').value) || 30.0;
  isLocked = true;
  
  document.getElementById('ui-lock').innerText = "已锁定";
  document.getElementById('ui-badge').innerText = "✅ 帧边界已锁定";
  document.getElementById('ui-badge').className = "status-badge status-valid";
  alert("校准成功！当前帧边界已死死锁定，后续将按固定周期均匀切块。");
}

// Goertzel 能量检测
function goertzelEnergy(samples, startIdx, length, targetFreq, sampleRate) {
  const k = Math.round((length * targetFreq) / sampleRate);
  const omega = (2 * Math.PI * k) / length;
  const coeff = 2 * Math.cos(omega);
  let s0 = 0, s1 = 0, s2 = 0;
  for (let i = 0; i < length; i++) {
    const win = 0.5 * (1 - Math.cos((2 * Math.PI * i) / (length - 1)));
    s0 = samples[startIdx + i] * win + coeff * s1 - s2;
    s2 = s1;
    s1 = s0;
  }
  return s1 * s1 + s2 * s2 - coeff * s1 * s2;
}

// 全局扫描寻找最佳对齐点
function findBestAlignment(samples, writePtr) {
  // 提取一段完整的环形数据
  const linear = new Float32Array(RING_SIZE);
  for (let i = 0; i < RING_SIZE; i++) {
    linear[i] = samples[(writePtr + i) % RING_SIZE];
  }

  let bestPeak = -999;
  let bestOffset = 0;
  const STEP = 4; // 4采样点步进
  const maxSteps = Math.floor((RING_SIZE - SEQ_SAMPLES) / STEP);

  for (let step = 0; step < maxSteps; step++) {
    const base = step * STEP;
    let dot = 0;
    for (let s = 0; s < NUM_SYMS; s++) {
      const symStart = base + s * SAMPLES_PER_SYM;
      let maxE = -1, bestTone = 0;
      for (let f = 0; f < 4; f++) {
        const e = goertzelEnergy(linear, symStart, SAMPLES_PER_SYM, FREQS[f], SAMPLE_RATE);
        if (e > maxE) { maxE = e; bestTone = f; }
      }
      const b1 = (bestTone >> 1) & 1;
      const b2 = bestTone & 1;
      dot += ((b1 === 1 ? 1 : -1) * GOLD_TEMPLATE[s * 2]) + ((b2 === 1 ? 1 : -1) * GOLD_TEMPLATE[s * 2 + 1]);
    }
    if (dot > bestPeak) {
      bestPeak = dot;
      bestOffset = base;
    }
  }
  return bestOffset;
}

// 实时音频处理主循环
function processAudioStream() {
  if (!isRxRunning) return;
  frameCount++;
  document.getElementById('ui-frames').innerText = frameCount;

  const linearSamples = new Float32Array(RING_SIZE);
  for (let i = 0; i < RING_SIZE; i++) {
    linearSamples[i] = ringBuffer[(ringWritePtr + i) % RING_SIZE];
  }

  if (!isLocked) {
    // 未锁定状态下，实时预览当前匹配峰值
    const tempOffset = findBestAlignment(linearSamples, 0);
    document.getElementById('ui-peak').innerText = "未校准";
    return;
  }

  // === 核心：一旦锁定，严格按照固定周期均匀切块，计算当前块内的微小移位 ===
  // 切出以 lockedSampleOffset 为起点的固定数据块
  const blockStart = lockedSampleOffset;
  let dotProduct = 0;
  const blockCurve = [];

  // 在锁定块的微小邻域（+/- 20 个采样点）内计算一个极高精度的精细移位
  const SEARCH_RANGE = 20;
  let bestBlockPeak = -999;
  let bestShift = 0;

  for (let shift = -SEARCH_RANGE; shift <= SEARCH_RANGE; shift++) {
    let currentDot = 0;
    const curStart = blockStart + shift;
    if (curStart < 0 || curStart + SEQ_SAMPLES >= RING_SIZE) continue;

    for (let s = 0; s < NUM_SYMS; s++) {
      const symStart = curStart + s * SAMPLES_PER_SYM;
      let maxE = -1, bestTone = 0;
      for (let f = 0; f < 4; f++) {
        const e = goertzelEnergy(linearSamples, symStart, SAMPLES_PER_SYM, FREQS[f], SAMPLE_RATE);
        if (e > maxE) { maxE = e; bestTone = f; }
      }
      const b1 = (bestTone >> 1) & 1;
      const b2 = bestTone & 1;
      currentDot += ((b1 === 1 ? 1 : -1) * GOLD_TEMPLATE[s * 2]) + ((b2 === 1 ? 1 : -1) * GOLD_TEMPLATE[s * 2 + 1]);
    }
    blockCurve.push(currentDot);
    if (currentDot > bestBlockPeak) {
      bestBlockPeak = currentDot;
      bestShift = shift;
    }
  }

  document.getElementById('ui-peak').innerText = `${bestBlockPeak} / 63`;
  document.getElementById('ui-lag').innerText = bestShift.toFixed(1);

  if (bestBlockPeak >= 40) {
    // 依据锁定的固定块移位计算当前真实物理距离
    const currentDist = calibratedD0 + (bestShift / SAMPLE_RATE) * SOUND_SPEED;
    document.getElementById('ui-dist').innerText = currentDist.toFixed(1);
    document.getElementById('ui-badge').innerText = `✅ 块锁定运行中 (Shift=${bestShift})`;
    document.getElementById('ui-badge').className = "status-badge status-valid";
  } else {
    document.getElementById('ui-badge').innerText = `⚠️ 当前块信噪比差`;
    document.getElementById('ui-badge').className = "status-badge status-reject";
  }
}

let rxInterval = null;
async function toggleRX() {
  const btn = document.getElementById('btn-rx-toggle');
  if (!isRxRunning) {
    try {
      rxStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, sampleRate: SAMPLE_RATE }
      });
      rxCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
      const source = rxCtx.createMediaStreamSource(rxStream);
      rxProcessor = rxCtx.createScriptProcessor(2048, 1, 1);
      rxProcessor.onaudioprocess = (e) => {
        const input = e.inputBuffer.getChannelData(0);
        for (let i = 0; i < input.length; i++) {
          ringBuffer[ringWritePtr] = input[i];
          ringWritePtr = (ringWritePtr + 1) % RING_SIZE;
        }
      };
      source.connect(rxProcessor);
      rxProcessor.connect(rxCtx.destination);

      isRxRunning = true;
      // 每 80ms（即一个 Gold 序列周期）均匀切块处理一次
      rxInterval = setInterval(processAudioStream, (SEQ_SAMPLES / SAMPLE_RATE) * 1000);

      btn.innerText = "停止接收监听";
      btn.className = "btn btn-stop";
    } catch (err) {
      alert("麦克风启动失败: " + err.message);
    }
  } else {
    isRxRunning = false;
    clearInterval(rxInterval);
    if (rxProcessor) rxProcessor.disconnect();
    if (rxStream) rxStream.getTracks().forEach(t => t.stop());
    if (rxCtx) rxCtx.close();
    btn.innerText = "启动接收监听";
    btn.className = "btn btn-start";
    isLocked = false;
    document.getElementById('ui-lock').innerText = "未锁定";
  }
}
</script>
</body>
</html>
